name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal and per-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache native downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/file-manager
            ${{ github.workspace }}/cache/native/proot-*
          key: native-downloads-${{ runner.os }}-${{ hashFiles('native/build-libsepol.sh', 'native/build-xkbcommon.sh', 'native/build-pulse.sh', 'native/build-proot.sh', 'scripts/fetch-xkbdata.sh') }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-write-lock-file --no-update-lock-file

      - name: Build universal debug APK
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            gradle clean :app:assembleDebug -Pabi=universal --no-daemon
          '

      - name: Build per-ABI debug APKs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            nix develop --command gradle :app:assembleDebug \
              -Pabi="$abi" -PskipNativeBuild -PskipDevToolsBuild --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "app-debug-$abi.apk"
          done

      - name: Verify packaged native artifacts
        run: |
          set -euo pipefail
          universal=app/build/outputs/apk/debug/app-debug.apk
          test -f "$universal"
          listing="$(unzip -Z1 "$universal")"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for entry in \
              "lib/$abi/libfiledaemon.so" \
              "lib/$abi/libproot.so" \
              "lib/$abi/libpulsehost.so" \
              "lib/$abi/libwayland_compositor.so" \
              "lib/$abi/libeglshim.so" \
              "lib/$abi/librun0.so" \
              "lib/$abi/libhere.so" \
              "lib/$abi/libagent.so"; do
              grep -Fxq "$entry" <<< "$listing"
            done

            per_abi="app-debug-$abi.apk"
            test -f "$per_abi"
            per_listing="$(unzip -Z1 "$per_abi")"
            for entry in \
              "lib/$abi/libfiledaemon.so" \
              "lib/$abi/libproot.so" \
              "lib/$abi/libpulsehost.so"; do
              grep -Fxq "$entry" <<< "$per_listing"
            done
          done

          for entry in \
            assets/xkb/rules/evdev \
            assets/xkb/rules/evdev.xml \
            assets/xkb/symbols/us; do
            grep -Fxq "$entry" <<< "$listing"
          done

          # The daemon must carry the chroot container policy backend; a stale
          # jniLibs binary otherwise ships a terminal with no SELinux injection.
          unzip -p "$universal" lib/arm64-v8a/libfiledaemon.so \
            | strings \
            | grep -Fq 'container domain injected'

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-universal-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload per-ABI APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-abis-${{ github.sha }}
          path: app-debug-*.apk
          if-no-files-found: error
          retention-days: 14
