[workspace]
members = ["run0", "here", "agent", "hub-client", "systemctl", "graphics-bridge"]
resolver = "2"

[package]
name = "file_daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
prost = "0.13"
tokio = { version = "1.41", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
# Connection authentication: Ed25519 verification + socket-name derivation.
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"

[build-dependencies]
prost-build = "0.13"
