[package]
name = "adblock_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "adblock"
crate-type = ["cdylib"]

[dependencies]
# `single-thread` is deliberately off: the WebView checks requests from more
# than one Chromium thread, so the engine must be Send + Sync. The embedded
# domain resolver keeps public-suffix matching self-contained on Android.
adblock = { version = "0.13.6", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
jni = "0.21"
