[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "A small terminal chat agent configured by the file-manager hub"

[dependencies]
crossterm = "0.28"
hub-client = { path = "../hub-client" }
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.41", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"
