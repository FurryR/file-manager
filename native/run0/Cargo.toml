[package]
name = "run0"
version = "0.1.0"
edition = "2021"
description = "Elevate privileges interactively through the file-manager daemon hub"

[[bin]]
name = "run0"
path = "src/main.rs"

[dependencies]
hub-client = { path = "../hub-client" }
libc = "0.2"
prost = "0.13"
tokio = { version = "1.41", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
