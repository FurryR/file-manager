syntax = "proto3";

package filedaemon;

option java_package = "io.furryr.file.proto";
option java_multiple_files = true;

message Request {
  uint64 id = 100;
  oneof command {
    ListRequest list = 1;
    CreateFileRequest create_file = 2;
    StatRequest stat = 3;
    RenameRequest rename = 6;
    DeleteRequest delete = 7;
    CreateDirRequest create_dir = 8;
    CopyRequest copy = 9;
    SpawnPTYRequest spawn_pty = 13;
    ResizePTYRequest resize_pty = 14;
    ClosePTYRequest close_pty = 15;
    OpenHandleRequest open_handle = 16;
    ReadHandleRequest read_handle = 17;
    WriteHandleRequest write_handle = 18;
    CloseHandleRequest close_handle = 19;
    GetHandleSizeRequest get_handle_size = 20;
    SeekHandleRequest seek_handle = 21;
    DupHandleRequest dup_handle = 22;
    TruncateHandleRequest truncate_handle = 23;
    WaitPtyRequest wait_pty = 24;
    KillPtyRequest kill_pty = 25;
    CopyFromSourceRequest copy_from_source = 26;
    ReadSourceResponse read_source_response = 27;
    ExecRequest exec = 28;
    ExitRequest exit = 29;
    CancelRequest cancel = 30;
    AuthRequest auth = 31;
    SignalPtyRequest signal_pty = 32;
  }
}

// The daemon issues a fresh nonce on every accepted connection; the client
// proves it holds this launch's Ed25519 private key by signing the daemon's
// socket name together with that nonce. No other request is served before the
// handshake succeeds, so a process that merely guesses the (public) socket
// name cannot talk to the daemon.
message ServerHello {
  bytes nonce = 1;
}

message AuthRequest {
  bytes signature = 1;
}

// Explicitly shut down the whole daemon, including other authenticated clients.
// Otherwise it exits when its last authenticated client disconnects, or when no
// client has authenticated within 10 seconds of starting the listener.
message ExitRequest {}

// Cancel an in-flight streaming request (e.g. a long copy) by the id it was
// issued with. Cancellation is scoped to the connection that issued the
// request: each connection keeps its own in-flight table.
message CancelRequest {
  uint64 target_id = 1;
}

message ListRequest {
  string path = 1;
}

message CreateFileRequest {
  string path = 1;
}

message StatRequest {
  string path = 1;
}

message RenameRequest {
  string path = 1;
  string new_name = 2;
}

message DeleteRequest {
  string path = 1;
}

message CreateDirRequest {
  string path = 1;
}

// ── Streaming copy (event-driven, no polling) ────────────────────

message CopyRequest {
  string from = 1;
  string to = 2;
}

// Destination-driven copy. A real source is attached with SCM_RIGHTS; a
// virtual source is read through ReadSourceRequest/ReadSourceResponse.
message CopyFromSourceRequest {
  string to = 1;
  uint64 source_size = 2;
  bool virtual_source = 3;
}

message ReadSourceRequest {
  uint64 request_id = 1;
  uint64 offset = 2;
  uint32 length = 3;
}

message ReadSourceResponse {
  uint64 request_id = 1;
  bytes data = 2;
  bool eof = 3;
  string error = 4;
}

message StreamProgress {
  bool finished = 1;
  uint64 total_bytes = 2;
  uint64 copied_bytes = 3;
  string current_name = 4;
}

message Response {
  uint64 id = 100;
  bool ok = 1;
  string error = 2;
  repeated FileEntry entries = 3;
  optional Stat stat = 4;
  optional StreamProgress stream_progress = 5;
  uint64 pty_id = 7;
  PTYEvent pty_event = 8;
  optional OpenHandleResponse open_handle = 9;
  optional ReadHandleResponse read_handle = 10;
  optional GetHandleSizeResponse get_handle_size = 11;
  optional DupHandleResponse dup_handle = 12;
  uint32 child_pid = 13;
  int32 exit_code = 14;
  optional ReadSourceRequest read_source_request = 15;
  optional ExecResponse exec = 16;
  optional ServerHello server_hello = 17;
}

// Non-PTY command execution. Runs [command] with [args], captures stdout and
// stderr, and reports the exit code. Used to run container commands under a
// root daemon (chroot) without allocating a pseudo-terminal.
message ExecRequest {
  string command = 1;
  repeated string args = 2;
  string cwd = 3;
  map<string, string> env = 4;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool is_directory = 3;
  int64 modified_at_ms = 4;
  bool is_symlink = 5;
  string real_path = 6;
  uint32 mode = 7;
  int64 size = 8;
}

message Stat {
  int64 usable_bytes = 1;
  int64 total_bytes = 2;
  bool exists = 3;
  bool is_directory = 4;
  // Whether the daemon can list this directory; mutations still report their own errors.
  bool can_create_children = 5;
  // Terminal availability, not a filesystem traversal permission check. Always true for a daemon.
  bool can_enter = 6;
}

message SpawnPTYRequest {
  // Empty selects the target user's passwd shell, falling back to an executable
  // /bin/sh or /system/bin/sh in the daemon's filesystem. argv[0] is the shell
  // basename; explicit commands retain command as argv[0]. Empty-command shells
  // initialize a clean target-user environment instead of inheriting daemon env.
  string command = 1;
  // Passed verbatim; callers request login mode explicitly with "-l".
  repeated string args = 2;
  // Explicit overrides. Shells retain the daemon's launch-configured PATH.
  map<string, string> env = 3;
  string term_type = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  string cwd = 7;
  // OS user to run the command as — a user name or a numeric UID. Unset
  // inherits the daemon's own credentials. Only a root daemon can change to an
  // arbitrary user; a non-root daemon can only honour its own uid. This is the
  // run0-style "drop into a user's shell" knob.
  optional string user = 8;
  // Nice level for the child. Negative values require a root daemon.
  optional int32 nice = 9;
  // One SCM_RIGHTS directory fd accompanies this request. The daemon reopens
  // its pathname in the target filesystem before establishing the child's cwd.
  bool cwd_fd = 10;
}

message ResizePTYRequest {
  uint64 pty_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
}

message PTYEvent {
  uint64 pty_id = 1;
  oneof event {
    uint32 exit_code = 2;
    string error = 3;
  }
}

message ClosePTYRequest {
  uint64 pty_id = 1;
}

message WaitPtyRequest {
  uint64 pty_id = 1;
}

message KillPtyRequest {
  uint64 pty_id = 1;
}

// Deliver an arbitrary signal to a PTY's process group (the run0 seam).
message SignalPtyRequest {
  uint64 pty_id = 1;
  int32 signal = 2;
}

// ── Virtual file handle protocol ───────────────────────────────────

enum HandleMode {
  READ = 0;
  WRITE = 1;
  READ_WRITE = 2;
}

message OpenHandleRequest {
  string path = 1;
  HandleMode mode = 2;
  // When true the daemon may attach a kernel fd to a READ reply. Whether the
  // client can actually receive it depends on the file's SELinux label relative
  // to the app's context; a denied hand-off just drops the fd (SCM_RIGHTS list
  // truncated) and the client reads through ReadHandle instead. Defaults false.
  bool want_fd = 3;
}

message OpenHandleResponse {
  uint64 handle_id = 1;
  uint64 size = 2;
}

message ReadHandleRequest {
  uint64 handle_id = 1;
  uint64 offset = 2;
  uint32 length = 3;
}

message ReadHandleResponse {
  bytes data = 1;
  bool eof = 2;
}

message WriteHandleRequest {
  uint64 handle_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message CloseHandleRequest {
  uint64 handle_id = 1;
}

message GetHandleSizeRequest {
  uint64 handle_id = 1;
}

message GetHandleSizeResponse {
  uint64 size = 1;
}

message SeekHandleRequest {
  uint64 handle_id = 1;
  uint64 position = 2;
}

message DupHandleRequest {
  uint64 handle_id = 1;
}

message DupHandleResponse {
  uint64 handle_id = 1;
  uint64 size = 2;
}

message TruncateHandleRequest {
  uint64 handle_id = 1;
  uint64 new_size = 2;
}
