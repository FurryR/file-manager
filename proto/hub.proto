syntax = "proto3";

package filehub;

option java_package = "io.furryr.file.proto.hub";
option java_multiple_files = true;

// The hub's own request/response protocol.
//
// The hub is a stable, long-lived, unauthenticated local server (run0 today,
// agents later). It deliberately exposes only a curated command/signal surface
// and translates each request onto the right daemon internally; the daemon's
// own file protocol is never exposed here. After a successful Exec, the PTY
// master fd travels as SCM_RIGHTS on the response frame.
message HubRequest {
  uint32 id = 1;
  oneof op {
    ListTargetsRequest list_targets = 2;
    SelectTargetRequest select_target = 3;
    ExecRequest exec = 4;
    ResizeRequest resize = 5;
    SignalRequest signal = 6;
    WaitRequest wait = 7;
    CloseRequest close = 8;
    HereRequest here = 9;
    GetAiConfigRequest get_ai_config = 10;
    HelloRequest hello = 11;
    ServiceControlRequest service_control = 12;
    OpenGraphicsRequest open_graphics = 13;
  }
}

message HubResponse {
  uint32 id = 1;
  bool ok = 2;
  string error = 3;
  oneof result {
    ListTargetsResponse targets = 4;
    ExecResponse exec = 5;
    WaitResponse wait = 6;
    AiConfigResponse ai_config = 7;
    CallerRoot caller_root = 8;
    ServiceControlResponse service_control = 9;
    GraphicsConnectionResponse graphics_connection = 10;
  }
}

// Exactly one O_PATH | O_DIRECTORY descriptor for the caller's / accompanies
// this handshake. The hub resolves its identity, not a client-supplied path.
message HelloRequest {
  string terminal_id = 1;
}

message CallerRoot {
  // Empty for the host filesystem.
  string container_name = 1;
  string host_path = 2;
}

// ── Target selection ──────────────────────────────────────────────

message ListTargetsRequest {}

message ListTargetsResponse {
  repeated Target targets = 1;
}

message Target {
  string name = 1;
  bool elevated = 2;
}

// Select the daemon target for this connection. Defaults to `primary`.
message SelectTargetRequest {
  string target = 1;
}

// ── Command execution ─────────────────────────────────────────────

message ExecRequest {
  // Empty selects the target user's passwd shell, falling back to an executable
  // /bin/sh or /system/bin/sh in the target filesystem.
  string command = 1;
  // Passed verbatim, including for an empty command (e.g. ["-l"] for login).
  repeated string args = 2;
  // Explicit overrides only; the hub injects its own HUB_SOCKET.
  map<string, string> env = 3;
  string cwd = 4;
  // OS user to run as (name or numeric UID); unset = daemon's own credentials.
  optional string user = 5;
  string term = 6;
  uint32 rows = 7;
  uint32 cols = 8;
  // Nice level for the spawned process. Negative values require the daemon to
  // be root.
  optional int32 nice = 9;
  // One SCM_RIGHTS directory fd accompanies this request. Resolve it to a
  // reachable pathname in the selected target using the caller root registered
  // by Hello. The daemon receives that pathname, never the borrowed descriptor.
  bool cwd_fd = 10;
}

// The PTY master fd rides this response as SCM_RIGHTS.
message ExecResponse {
  uint64 pty_id = 1;
  uint32 pid = 2;
}

// ── PTY control ───────────────────────────────────────────────────

message ResizeRequest {
  uint64 pty_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
}

message SignalRequest {
  uint64 pty_id = 1;
  int32 signal = 2;
}

message WaitRequest {
  uint64 pty_id = 1;
}

message WaitResponse {
  int32 exit_code = 1;
}

message CloseRequest {
  uint64 pty_id = 1;
}

// Reveal the entry represented by exactly one O_PATH | O_NOFOLLOW descriptor.
// The hub resolves the descriptor in its host namespace; no client pathname is
// trusted, and the final symlink itself (including a dangling link) is retained.
message HereRequest {}

message GetAiConfigRequest {}

message AiConfigResponse {
  string base_url = 1;
  string api_key = 2;
  string model = 3;
}

message ServiceControlRequest { string action = 1; repeated string units = 2; string content = 3; }
message ServiceStatus { string name = 1; string state = 2; bool enabled = 3; uint32 pid = 4; int32 exit_code = 5; string detail = 6; string description = 7; }
message ServiceControlResponse { repeated ServiceStatus services = 1; string text = 2; int32 exit_code = 3; }

// A connected host VirGL vtest socket is returned as one SCM_RIGHTS descriptor.
// Bytes and ancillary descriptors flow directly after this handshake.
message OpenGraphicsRequest {}
message GraphicsConnectionResponse {}
