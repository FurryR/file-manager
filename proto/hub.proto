syntax = "proto3";

package filehub;

option java_package = "io.furryr.file.proto.hub";
option java_multiple_files = true;

// The hub's own request/response protocol.
//
// The hub is a stable, long-lived local server (run0 today, agents later). Its
// socket name is an open address; the per-daemon key carried by Hello is the
// credential. Every operation requires Hello first. After a successful Exec,
// the PTY master fd travels as SCM_RIGHTS on the response frame.
message HubRequest {
  uint32 id = 1;
  oneof op {
    ListTargetsRequest list_targets = 2;
    ExecRequest exec = 4;
    ResizeRequest resize = 5;
    SignalRequest signal = 6;
    WaitRequest wait = 7;
    CloseRequest close = 8;
    HereRequest here = 9;
    GetAiConfigRequest get_ai_config = 10;
    HelloRequest hello = 11;
    ReadFileRequest read_file = 12;
    WriteFileRequest write_file = 13;
    GlobRequest glob = 14;
    SetAiSelectionRequest set_ai_selection = 15;
    WaitExecRequest wait_exec = 16;
  }
}

message HubResponse {
  uint32 id = 1;
  bool ok = 2;
  string error = 3;
  oneof result {
    ListTargetsResponse targets = 4;
    ExecResponse exec = 5;
    WaitResponse wait = 6;
    AiConfigResponse ai_config = 7;
    CallerRoot caller_root = 8;
    ReadFileResponse read_file = 9;
    WriteFileResponse write_file = 10;
    GlobResponse glob = 11;
  }
}

// The handshake. `key` is the per-daemon key embedded after `@` in
// HUB_SOCKET. The hub resolves it to a live daemon, and returns the caller's
// current container id. No file descriptor is attached.
message HelloRequest {
  string terminal_id = 1;
  string key = 2;
}

message CallerRoot {
  // `host`, `app`, or `container-<name>`.
  string container_id = 1;
}

// ── Targets ──────────────────────────────────────────────────────

message ListTargetsRequest {}

message ListTargetsResponse {
  repeated Target targets = 1;
}

message Target {
  // `host`, `app`, or `container-<name>`.
  string name = 1;
  bool elevated = 2;
  // Whether a daemon for this target is currently alive. Every container known
  // to the app is listed, so stopped containers appear here too and are started
  // on first use.
  bool running = 3;
}

// ── Command execution ─────────────────────────────────────────────

message ExecRequest {
  // Empty selects the target user's passwd shell, falling back to an executable
  // /bin/sh or /system/bin/sh in the target filesystem.
  string command = 1;
  // Passed verbatim, including for an empty command (e.g. ["-l"] for login).
  repeated string args = 2;
  // Explicit overrides only; the hub injects its own HUB_SOCKET.
  map<string, string> env = 3;
  string cwd = 4;
  // OS user to run as (name or numeric UID); unset = daemon's own credentials.
  optional string user = 5;
  string term = 6;
  uint32 rows = 7;
  uint32 cols = 8;
  // Nice level for the spawned process. Negative values require the daemon to
  // be root.
  optional int32 nice = 9;
  // `host` (default when empty), `app`, or `container-<name>`.
  string container_id = 10;
  // When true, run without a PTY and attach stdout/stderr pipe descriptors to
  // the response instead of a PTY master fd. This is the agent's `exec` tool
  // mode; the caller reads both pipes to EOF and then sends WaitExec.
  bool pipes = 11;
}

// In pipe mode, the response carries two descriptors (stdout then stderr) via
// SCM_RIGHTS and an exec handle for WaitExec. In PTY mode, the PTY master fd
// rides the response instead.
message ExecResponse {
  uint64 pty_id = 1;
  uint32 pid = 2;
  // Pipe mode only: handle used with WaitExec.
  uint64 exec_id = 3;
}

message WaitExecRequest {
  // The exec_id returned by a pipe-mode ExecResponse.
  uint64 exec_id = 1;
}

// ── Agent file tools ──────────────────────────────────────────────

message ReadFileRequest {
  string path = 1;
  // Byte offset; defaults to the start of the file.
  uint64 offset = 2;
  // Maximum bytes to return; the hub applies its own upper bound.
  uint32 length = 3;
  // `host` (default when empty), `app`, or `container-<name>`.
  string container_id = 4;
}

message ReadFileResponse {
  bytes data = 1;
  // Total file size in bytes.
  uint64 size = 2;
  bool eof = 3;
}

message WriteFileRequest {
  string path = 1;
  bytes data = 2;
  // `host` (default when empty), `app`, or `container-<name>`.
  string container_id = 3;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message GlobRequest {
  // Glob pattern matched against paths relative to [path], e.g. `**/*.kt`.
  string pattern = 1;
  // Absolute directory to start from; defaults to `/`.
  string path = 2;
  // Best-effort result cap; the hub applies its own upper bound. 0 = default.
  uint32 max_results = 3;
  // `host` (default when empty), `app`, or `container-<name>`.
  string container_id = 4;
}

message GlobResponse {
  repeated string paths = 1;
  bool truncated = 2;
}

// ── PTY control ───────────────────────────────────────────────────

message ResizeRequest {
  uint64 pty_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
}

message SignalRequest {
  uint64 pty_id = 1;
  int32 signal = 2;
}

message WaitRequest {
  uint64 pty_id = 1;
}

message WaitResponse {
  int32 exit_code = 1;
}

message CloseRequest {
  uint64 pty_id = 1;
}

// Reveal an entry by its path in the caller's namespace. The final symlink
// itself (including a dangling link) is retained.
message HereRequest {
  string path = 1;
}

message GetAiConfigRequest {}

message AiConfigResponse {
  string base_url = 1;
  string api_key = 2;
  // The last model selected by the agent, persisted by the app.
  string model = 3;
  // The last reasoning effort selected by the agent.
  string effort = 4;
  // Display name of the active provider.
  string provider = 5;
}

message SetAiSelectionRequest {
  string model = 1;
  string effort = 2;
}
