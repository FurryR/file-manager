syntax = "proto3";

package filehub;

option java_package = "io.furryr.file.proto.hub";
option java_multiple_files = true;

// The hub's own request/response protocol.
//
// The hub is a stable, long-lived local server (run0 today, agents later). Its
// socket name is an open address; the per-daemon key carried by Hello is the
// credential. Every operation requires Hello first. After a successful Exec,
// the PTY master fd travels as SCM_RIGHTS on the response frame.
message HubRequest {
  uint32 id = 1;
  oneof op {
    ListTargetsRequest list_targets = 2;
    ExecRequest exec = 4;
    ResizeRequest resize = 5;
    SignalRequest signal = 6;
    WaitRequest wait = 7;
    CloseRequest close = 8;
    HereRequest here = 9;
    GetAiConfigRequest get_ai_config = 10;
    HelloRequest hello = 11;
    ReadFileRequest read_file = 12;
    WriteFileRequest write_file = 13;
    GlobRequest glob = 14;
    SetAiSelectionRequest set_ai_selection = 15;
    WaitExecRequest wait_exec = 16;
    CloseExecRequest close_exec = 17;
    ListDirectoryRequest list_directory = 18;
    CopyFileRequest copy_file = 19;
    ChatRequest chat = 20;
    CancelChatRequest cancel_chat = 21;
    GetHistoryRequest get_history = 22;
    SetHistoryRequest set_history = 23;
    GetModelsRequest get_models = 24;
    GetCapabilitiesRequest get_capabilities = 25;
    McpHttpRequest mcp_http = 26;
    CancelMcpHttpRequest cancel_mcp_http = 27;
    ListSessionsRequest list_sessions = 28;
    GetActiveSessionRequest get_active_session = 29;
    SetActiveSessionRequest set_active_session = 30;
    DeleteSessionRequest delete_session = 31;
    SubscribeSessionEventsRequest subscribe_session_events = 32;
  }
}

message HubResponse {
  uint32 id = 1;
  bool ok = 2;
  string error = 3;
  oneof result {
    ListTargetsResponse targets = 4;
    ExecResponse exec = 5;
    WaitResponse wait = 6;
    AiConfigResponse ai_config = 7;
    CallerRoot caller_root = 8;
    ReadFileResponse read_file = 9;
    WriteFileResponse write_file = 10;
    GlobResponse glob = 11;
    ListDirectoryResponse list_directory = 12;
    CopyFileResponse copy_file = 13;
    ChatEvent chat = 14;
    HistoryResponse history = 15;
    ModelsResponse models = 16;
    CapabilitiesResponse capabilities = 17;
    McpHttpEvent mcp_http = 18;
    SessionsResponse sessions = 19;
    ActiveSessionResponse active_session = 20;
    SessionTitle session_title = 21;
  }
}

// The handshake. `key` is the per-daemon key embedded after `@` in
// HUB_SOCKET. The hub resolves it to a live daemon, and returns the caller's
// current container id. No file descriptor is attached.
message HelloRequest {
  string terminal_id = 1;
  string key = 2;
}

message CallerRoot {
  // `host`, `app`, or `container-<name>`.
  string container_id = 1;
}

// ── Targets ──────────────────────────────────────────────────────

message ListTargetsRequest {}

message ListTargetsResponse {
  repeated Target targets = 1;
}

message Target {
  // Execution target id (`host`, `app`, `container-<name>`) or the canonical
  // root URI of a file location (`ftp://host`, `saf://id`, ...).
  string name = 1;
  bool elevated = 2;
  // Whether an execution target has a live daemon. File locations are always
  // available.
  bool running = 3;
  // `exec`, `ftp`, `sftp`, `saf`, `alist`, `ssh`, ...
  string kind = 4;
  // User-facing label. For execution targets this is the target name without
  // the internal `container-` prefix.
  string label = 5;
  // Canonical VFS root for file operations: `file:///` for host,
  // `container://<name>` for a container, or a location root URI. Empty when
  // the target has no VFS provider (app).
  string root = 6;
}

// ── Command execution ─────────────────────────────────────────────

message ExecRequest {
  // Empty selects the target user's passwd shell, falling back to an executable
  // /bin/sh or /system/bin/sh in the target filesystem.
  string command = 1;
  // Passed verbatim, including for an empty command (e.g. ["-l"] for login).
  repeated string args = 2;
  // Explicit overrides only; the hub injects its own HUB_SOCKET.
  map<string, string> env = 3;
  string cwd = 4;
  // OS user to run as (name or numeric UID); unset = daemon's own credentials.
  optional string user = 5;
  string term = 6;
  uint32 rows = 7;
  uint32 cols = 8;
  // Nice level for the spawned process. Negative values require the daemon to
  // be root.
  optional int32 nice = 9;
  // `host` (default when empty), `app`, or `container-<name>`.
  string container_id = 10;
  // When true, run without a PTY and attach stdout/stderr pipe descriptors to
  // the response instead of a PTY master fd. This is the agent's `exec` tool
  // mode; the caller reads both pipes to EOF and then sends WaitExec.
  bool pipes = 11;
}

// In pipe mode, the response carries two descriptors (stdout then stderr) via
// SCM_RIGHTS and an exec handle for WaitExec. In PTY mode, the PTY master fd
// rides the response instead.
message ExecResponse {
  uint64 pty_id = 1;
  uint32 pid = 2;
  // Pipe mode only: handle used with WaitExec.
  uint64 exec_id = 3;
}

message WaitExecRequest {
  // The exec_id returned by a pipe-mode ExecResponse.
  uint64 exec_id = 1;
}

// Cancel a pipe-mode exec and terminate its process group.
message CloseExecRequest {
  // The exec_id returned by a pipe-mode ExecResponse.
  uint64 exec_id = 1;
}

// ── Agent file tools ──────────────────────────────────────────────

message ReadFileRequest {
  // Absolute path in the authenticated caller target, or a canonical VFS URI
  // such as `container://name/path`, `saf://id/path` or `ftp://host/path`.
  string path = 1;
  // Byte offset; defaults to the start of the file.
  uint64 offset = 2;
  // Maximum bytes to return; the hub applies its own upper bound.
  uint32 length = 3;
  reserved 4;
}

message ReadFileResponse {
  bytes data = 1;
  // Total file size in bytes.
  uint64 size = 2;
  bool eof = 3;
}

message ListDirectoryRequest {
  // Absolute path in the authenticated caller target, or a canonical VFS URI.
  string path = 1;
  reserved 2;
}

message ListDirectoryEntry {
  string name = 1;
  string path = 2;
  bool directory = 3;
  uint64 size = 4;
  bool symlink = 5;
}

message ListDirectoryResponse {
  repeated ListDirectoryEntry entries = 1;
  bool truncated = 2;
}

message WriteFileRequest {
  // Absolute path in the authenticated caller target, or a canonical VFS URI.
  string path = 1;
  bytes data = 2;
  reserved 3;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message GlobRequest {
  // Glob pattern matched against paths relative to [path], e.g. `**/*.kt`.
  string pattern = 1;
  // Absolute directory to start from; defaults to `/`.
  string path = 2;
  // Best-effort result cap; the hub applies its own upper bound. 0 = default.
  uint32 max_results = 3;
  reserved 4;
}

message GlobResponse {
  repeated string paths = 1;
  bool truncated = 2;
}

message CopyFileRequest {
  // Absolute path in the authenticated caller target, or a canonical VFS URI.
  string from = 1;
  // Exact destination path. Its parent directory must already exist. This may
  // also be a canonical VFS URI, including a network location.
  string to = 2;
}

message CopyFileResponse {
  // Total bytes written by the copy; zero for an empty directory tree.
  uint64 bytes_copied = 1;
}

// ── AI chat, sessions and capabilities ────────────────────────────

message ChatRequest {
  string session_id = 1;
  string model = 2;
  string effort = 3;
  string system = 4;
  // JSON array of {role, content, tool_calls, tool_call_id}.
  string messages_json = 5;
  // JSON array of OpenAI-style tool definitions; empty when tools are off.
  string tools_json = 6;
  // When append is true, messages_json is only the new tail and the hub loads
  // the stored session history, verifying it currently has base_count entries.
  bool append = 7;
  uint32 base_count = 8;
}

// A Chat response is streamed as several HubResponse frames sharing the request
// id. The last frame sets done, or carries an error and done.
message ChatEvent {
  oneof event {
    string reasoning_delta = 1;
    string content_delta = 2;
    // JSON array of complete tool calls, emitted once the provider finishes.
    string tool_calls_json = 3;
    TokenUsage usage = 4;
    bool done = 5;
    string error = 6;
    bool tool_calling = 7;
  }
}

message TokenUsage {
  uint64 prompt_tokens = 1;
  uint64 completion_tokens = 2;
}

message CancelChatRequest {
  // The request id of the Chat being cancelled.
  uint32 chat_id = 1;
}

message GetHistoryRequest {
  string session_id = 1;
}

message HistoryResponse {
  // JSON array of messages, or empty when no history exists.
  string messages_json = 1;
  // Persisted display title, or empty when the session has none.
  string title = 2;
}

message SetHistoryRequest {
  string session_id = 1;
  string messages_json = 2;
}

message GetModelsRequest {}

message ModelsResponse {
  // Normalized catalog JSON: {"models": [...], "info": {name: {...}}}.
  string catalog_json = 1;
}

message GetCapabilitiesRequest {
  // Caller cwd, used to discover workspace-local MCP configuration.
  string cwd = 1;
}

message McpServerConfig {
  string name = 1;
  // Remote MCP endpoint (Streamable HTTP). Empty for a stdio server.
  string url = 2;
  map<string, string> headers = 3;
  // Local stdio server; ignored when `url` is set.
  string command = 4;
  repeated string args = 5;
  map<string, string> env = 6;
  string cwd = 7;
  bool enabled = 8;
  // `global` or `workspace`.
  string source = 9;
  // `http` or `stdio`. Empty means infer from url/command.
  string transport = 10;
}

message CapabilitiesResponse {
  repeated McpServerConfig mcp_servers = 1;
}

// Proxy one HTTP request for a remote (online) MCP server. The hub resolves
// `server` for the caller, uses its configured URL and injects configured
// headers; it does not parse MCP. Responses stream as McpHttpEvent frames with
// the request id.
message McpHttpRequest {
  string server = 1;
  string cwd = 2;
  string method = 3;
  // Optional path appended to the configured server URL.
  string path = 4;
  map<string, string> headers = 5;
  bytes body = 6;
}

message McpHttpEvent {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes data = 3;
  bool done = 4;
  string error = 5;
}

message CancelMcpHttpRequest {
  uint32 request_id = 1;
}

message SessionInfo {
  string id = 1;
  string title = 2;
  uint64 updated_at = 3;
  uint32 message_count = 4;
}

message ListSessionsRequest {}

message SessionsResponse {
  repeated SessionInfo sessions = 1;
}

message GetActiveSessionRequest {}

message ActiveSessionResponse {
  string session_id = 1;
}

message SetActiveSessionRequest {
  string session_id = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

// Server-pushed session changes. The response to the subscribe request is the
// acknowledgement; subsequent HubResponse frames share that request id and
// carry SessionTitle as they happen.
message SubscribeSessionEventsRequest {}

message SessionTitle {
  string session_id = 1;
  string title = 2;
}

// ── PTY control ───────────────────────────────────────────────────

message ResizeRequest {
  uint64 pty_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
}

message SignalRequest {
  uint64 pty_id = 1;
  int32 signal = 2;
}

message WaitRequest {
  uint64 pty_id = 1;
}

message WaitResponse {
  int32 exit_code = 1;
}

message CloseRequest {
  uint64 pty_id = 1;
}

// Reveal an entry by its path in the caller's namespace. The final symlink
// itself (including a dangling link) is retained.
message HereRequest {
  string path = 1;
}

message GetAiConfigRequest {}

message AiConfigResponse {
  string base_url = 1;
  string api_key = 2;
  // The last model selected by the agent, persisted by the app.
  string model = 3;
  // The last reasoning effort selected by the agent.
  string effort = 4;
  // Display name of the active provider.
  string provider = 5;
}

message SetAiSelectionRequest {
  string model = 1;
  string effort = 2;
}
